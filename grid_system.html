<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid System</title>
    <style>
        .container {
            display: grid;
            grid-template-areas: "header header"
            "menu content"
            "footer footer";
            background-color: aquamarine;
            border: 2px solid;
            padding: 5px;
            grid-template-columns: 1fr 3fr;
            gap: 3px;
        }

        .container div {
            padding: 10px;
            border: 1px solid black;
        }

        .container div.header {
            grid-area: header;
            text-align: center;
        }

        .container div.menu {
            grid-area: menu;
        }

        .container div.content {
            grid-area: content;
        }

        .container div.footer {
            grid-area: footer;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Header</h1>
        </div>
        <div class="menu">
            <a href="#">Link 1</a><br>
            <a href="#">Link 2</a><br>
            <a href="#">Link 3</a><br>
        </div>
        <div class="content">
            <h2>Mern Stack</h2>
            <p>Mern stack course is 3 months course. This course contain below modules: 
                1. My Sql.
                2. web development
                3. node js
                4. React
            </p>
        </div>
        <div class="footer">
            <h1>Footer</h1>
        </div>
    </div>
</body>
</html>
