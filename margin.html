<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Example</title>
    <style>
        #p1{
            border: 2px solid black;
        }
        #p2{
            margin: 10px;
            border: 2px solid pink;
        }
        #p3{
            margin: 20px 50px;
            border: 2px solid green;
        }
        #p4{
            margin: 30px 40px 15px 50px;
            border: 2px solid blueviolet;
        }
    </style>
</head>
<body>
    <!-- margin is a space outside an html element it provides external spacing and helps to separate two or more elements from each other -->
     <p id="p1">Good Morning(without margin)</p>
     <p id="p2"> Good Morning(with margin)</p>
     <p id="p3">Good Morning(vertical margin(top and bottom) and horizontal margin(left and right)</p>
     <p id="p4">Individual margin for each side</p>
     <!-- new example -->
      <!--marquee tag- is a container that implements for creating scrollig text or images within a web page from left to right,top to bottom etc.  -->
      <marquee  width="60%" direction="up" height="100px" scrollamount="1"> up</marquee>
      <marquee  width="60%" direction="right" height="100px"scrollamount="20"> right</marquee>
      <marquee  width="60%" direction="left" height="100px"scrollamount="50"> left</marquee>
      <marquee  width="60%" direction="down" height="100px"scrollamount="60"> down</marquee>
 
</body>
</html>
