<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVIGATION BAR</title>
    <style>
        h1 {
            margin: 10px;
        }

        ul {
            background-color: bisque;
            margin: 0px;
            padding: 0px;
            list-style-type: none;
        }

        ul li {
            float: left;
        }

        ul li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            background-color: blue;
        }
    </style>
</head>
