<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding Example</title>
    <style>
        #p1{
            border: 2px solid black;
        }
        #p2{
            padding: 15px;
            border: 2px solid red;
        }
        #p3{
            padding: 20px 50px;
            border: 2px solid yellow;
        }
        #p4{
            padding:30px 30px 40px 75px;
            border: 2px solid blue;
        }
    </style>
</head>
<body>
    <!-- padding is a space between element content and its border -->
    <p id="p1">Good Morning(without padding)</p>
    <p id="p2">Good Morning(with padding)</p>
    <!-- vertical and horizontal padding where we can provide 2 values -->
    <p id="p3"> Vertical and Horizontal padding</p>
    <p id="p4"> Individual padding for each side</p>
</body> 
</html>
