<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - Amazon</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color:white;
}


/* Amazon Logo */

.logo{
    text-align:center;
    margin-top:35px;
}


.logo h1{
    font-size:32px;
    font-weight:bold;
    margin:0;
    color:#111;
}


.logo-line{
    width:45px;
    height:3px;
    background:#ff9900;
    margin:auto;
    border-radius:50%;
}



/* Main Box */

.container{

    width:330px;
    border:1px solid #ddd;
    border-radius:8px;
    padding:25px;
    margin:20px auto;

}



/* Create Account Heading */

.container h2{

    font-size:28px;
    font-weight:400;
    margin:0 0 20px 0;

}



label{

    font-size:13px;
    font-weight:bold;

}



/* Input Box */

input[type="text"],
input[type="password"]{

    width:100%;
    height:35px;
    margin-top:5px;
    padding-left:8px;
    border:1px solid #888;
    border-radius:4px;
    box-sizing:border-box;

}



/* Button */

input[type="submit"]{

    width:100%;
    height:35px;
    background:#ffd814;
    border:none;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;

}


input[type="submit"]:hover{

    background:#f7ca00;

}



/* Text */

p{

    font-size:12px;
    line-height:18px;
    color:#555;

}


a{

    color:#0066c0;
    text-decoration:none;

}


a:hover{

    text-decoration:underline;

}


hr{

    border:0;
    border-top:1px solid #ddd;

}


</style>

</head>


<body>



<!-- Amazon Logo -->

<div class="logo">

<h1>amazon</h1>

<div class="logo-line"></div>

</div>




<!-- Account Box -->

<div class="container">


<h2>Create account</h2>



<form action="" method="get">


<label>Your name</label>

<br>

<input type="text"
placeholder="First and last name"
required>


<br><br>



<label>Mobile number or email</label>

<br>

<input type="text"
required>


<br><br>



<label>Password</label>

<br>

<input type="password"
placeholder="At least 6 characters"
required>


<p>
ⓘ Passwords must be at least 6 characters.
</p>



<label>Re-enter password</label>

<br>

<input type="password">



<br><br>



<input type="submit" value="Continue">



<p>

By creating an account, you agree to Amazon's

<a href="#">
Conditions of Use
</a>

and

<a href="#">
Privacy Notice
</a>.

</p>



<hr>



<p>

Already have an account?

<a href="#">
Sign in
</a>

</p>



<p>

Buying for work?

<a href="#">
Create a free business account
</a>

</p>



</form>


</div>



</body>
</html>
